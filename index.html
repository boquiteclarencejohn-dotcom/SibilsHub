const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert("Storage is full or blocked.")}}};
let db=null;const mem=new Map();
function openDB(){return new Promise(r=>{try{const q=indexedDB.open("ce-hub",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function putFile(id,blob){return new Promise(r=>{if(!db){mem.set(id,blob);return r()}const t=db.transaction("f","readwrite");t.objectStore("f").put(blob,id);t.oncomplete=()=>r();t.onerror=()=>{mem.set(id,blob);r()}})}
function getFile(id){return new Promise(r=>{if(!db)return r(mem.get(id));const q=db.transaction("f").objectStore("f").get(id);q.onsuccess=()=>r(q.result||mem.get(id));q.onerror=()=>r(mem.get(id))})}
function delFile(id){mem.delete(id);if(db)try{db.transaction("f","readwrite").objectStore("f").delete(id)}catch(e){}}

/* QUIZ */
const bankAll=()=>SEED.concat(LS.get("qs",[]));
let Q=null,timer=null;
function quizSetup(){
 clearInterval(timer);const b=bankAll();
 const hist=LS.get("hist",[]);
 $("#quiz").innerHTML=`<div class="card"><label>Subject</label>
 <select id="qSub"><option>All</option>${SUBJECTS.map(s=>`<option>${s}</option>`).join("")}</select>
 <label>Number of questions</label><input id="qN" type="number" min="1" value="5">
 <label>Time limit in minutes (0 = no limit)</label><input id="qT" type="number" min="0" value="0">
 <button class="p" id="qGo">Start quiz</button>
 <p class="muted">${b.length} questions in the bank.</p></div>
 ${hist.length?`<div class="card"><b>Recent scores</b>${hist.slice(-5).reverse().map(h=>`<div class="row muted"><span>${esc(h.s)} · ${esc(h.d)}</span><span>${h.c}/${h.n}</span></div>`).join("")}</div>`:""}`;
 $("#qGo").onclick=()=>{
  const sub=$("#qSub").value;let pool=b.filter(x=>sub==="All"||x.s===sub);
  if(!pool.length)return alert("No questions for that subject yet.");
  pool=pool.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x).slice(0,Math.max(1,+$("#qN").value||5));
  const mins=+$("#qT").value||0;
  Q={sub,list:pool,i:0,ans:[],left:mins*60,mins};
  if(mins){timer=setInterval(()=>{Q.left--;const t=$("#tm");if(t)t.textContent=fmt(Q.left);if(Q.left<=0)finish()},1000)}
  ask()};
}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const typeset=el=>{try{if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el||$("#quiz")])}catch(e){}};
function ask(){
 const q=Q.list[Q.i];
 $("#quiz").innerHTML=`<div class="card"><div class="row"><span class="tag">${esc(q.s)}</span><span class="muted">${Q.i+1}/${Q.list.length}${Q.mins?` · <b id="tm">${fmt(Q.left)}</b>`:""}</span></div>
 <div class="bar" style="margin:10px 0"><i style="width:${Q.i/Q.list.length*100}%"></i></div>
 <p><b>${esc(q.q)}</b></p>${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div>`;
 $("#quiz").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{Q.ans[Q.i]=+b.dataset.i;if(++Q.i>=Q.list.length)finish();else ask()});
 typeset();
}
function finish(){
 clearInterval(timer);if(!Q)return;
 const L=Q.list,c=L.filter((q,i)=>Q.ans[i]===q.a).length;
 const h=LS.get("hist",[]);h.push({s:Q.sub,c,n:L.length,d:new Date().toLocaleDateString()});LS.set("hist",h.slice(-30));
 $("#quiz").innerHTML=`<div class="card"><h2 style="margin:0">Score: ${c}/${L.length} (${Math.round(c/L.length*100)}%)</h2></div>
 ${L.map((q,i)=>`<div class="card"><p><b>${i+1}. ${esc(q.q)}</b></p>${q.o.map((o,j)=>`<div class="opt ${j===q.a?"ok":j===Q.ans[i]?"no":""}" style="padding:6px 0">${String.fromCharCode(65+j)}. ${esc(o)}${j===q.a?" ✓":j===Q.ans[i]?" ✗":""}</div>`).join("")}<p class="muted">${esc(q.e||"")}</p></div>`).join("")}
 <button class="p" id="again">Back to quiz hub</button>`;
 Q=null;$("#again").onclick=quizSetup;typeset();
}

/* BEAM SOLVER */
let SL=[{t:"w",m:10,a:0,b:6}];
const mx=a=>{let b=0,j=0;a.forEach((v,i)=>{if(Math.abs(v)>Math.abs(b)){b=v;j=i}});return[b,j]};
const nf=(v,n=4)=>+v.toPrecision(n);
function solveBeam(sup,L,EI,loads){
 const N=400,h=L/N,xs=[],V=[],M=[],ct=sup==="ct";
 let tot=0,mom=0;
 loads.forEach(l=>{if(l.t==="P"){tot+=l.m;mom+=l.m*l.a}else{const w=l.m*(l.b-l.a);tot+=w;mom+=w*(l.a+l.b)/2}});
 const RB=ct?0:mom/L,RA=tot-RB,M0=ct?mom:0;
 for(let i=0;i<=N;i++){
  const x=i*h;let v=RA,m=RA*x-M0;
  loads.forEach(l=>{
   if(l.t==="P"){if(x>l.a){v-=l.m;m-=l.m*(x-l.a)}}
   else if(x>l.a){const e=Math.min(x,l.b);v-=l.m*(e-l.a);m-=l.m*(e-l.a)*(x-(l.a+e)/2)}
  });
  xs.push(x);V.push(v);M.push(m);
 }
 const k=M.map(m=>m/EI),s=[0],d=[0];
 for(let i=1;i<=N;i++){s.push(s[i-1]+h*(k[i]+k[i-1])/2);d.push(d[i-1]+h*(s[i]+s[i-1])/2)}
 const t0=ct?0:-d[N]/L;
 return{xs,V,M,k,RA,RB,M0,th:s.map(v=>(v+t0)*180/Math.PI),dl:d.map((v,i)=>-(v+t0*xs[i])*1000)};
}

}

  const L=+$("#sL").value,EI=$("#sE").value*$("#sI").value,sup=$("#sSup").value;
  if(!(L>0&&EI>0))return alert("Enter positive L, E and I.");
  if(!SL.length)return alert("Add at least one load.");
  if(SL.some(l=>l.a>L||l.b>L))return alert("A load lies beyond the span. Remove it or increase L.");
  const r=solveBeam(sup,L,EI,SL),at=(a,u)=>{const[b,j]=mx(a);return `${nf(b)} ${u} at x = ${r.xs[j].toFixed(2)} m`};
  const km=mx(r.k)[0],dm=Math.abs(mx(r.dl)[0]),R=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`;
  $("#sOut").innerHTML=`<div class="card"><div style="overflow-x:auto"><table>`+
   R("Reactions",sup==="ss"?`R<sub>A</sub> = ${nf(r.RA)} kN, R<sub>B</sub> = ${nf(r.RB)} kN`:`R = ${nf(r.RA)} kN, M<sub>fixed</sub> = ${nf(r.M0)} kN·m`)+
   R("Max shear",at(r.V,"kN"))+R("Max moment",at(r.M,"kN·m"))+R("Max deflection",at(r.dl,"mm"))+R("Span / deflection",dm?"L/"+nf(L*1000/dm,3):"none")+R("Max slope",at(r.th,"°"))+R("Max curvature",`${nf(km)} 1/m`+(km?` (radius ${nf(Math.abs(1/km))} m)`:""))+
   `</table></div></div>`;
 };
}

/* QUIZ HUB */
let qN=5,qT=0;
const GN={MSTC:"Mathematics, Surveying and Transportation",HPGE:"Hydraulics and Geotechnical",PSAD:"Structural Analysis and Design"};
quizSetup=function(){
 clearInterval(timer);
 const b=bankAll(),h=LS.get("hist",[]);
 const card=(name,n,sub)=>{const bs=h.filter(x=>x.s===sub),best=bs.length?` · best ${Math.max(...bs.map(x=>Math.round(x.c/x.n*100)))}%`:"";return `<div class="card row"><div><b>${name}</b><br><span class="muted">${n} questions${best}</span></div><button class="p" data-s="${sub}" ${n?"":"disabled"}>Start</button></div>`};
 $("#quiz").innerHTML=`<div class="card"><div class="row"><label>Questions per quiz</label><input id="qN" type="number" min="1" value="${qN}" style="width:90px"></div><div class="row"><label>Time limit in minutes (0 = none)</label><input id="qT" type="number" min="0" value="${qT}" style="width:90px"></div></div>`+
  Object.keys(QG).map(g=>`<h3 style="margin:18px 0 2px">${g}</h3><p class="muted" style="margin:0">${GN[g]}</p>`+QG[g].map(s=>card(s,b.filter(x=>x.s===s).length,s)).join("")).join("")+
  `<h3 style="margin:18px 0 2px">Mixed</h3>`+card("All subjects",b.length,"All")+
  (h.length?`<div class="card"><b>Recent scores</b>${h.slice(-5).reverse().map(x=>`<div class="row muted"><span>${esc(x.s)} · ${esc(x.d)}</span><span>${x.c}/${x.n}</span></div>`).join("")}</div>`:"");
 $("#quiz").querySelectorAll("[data-s]").forEach(bt=>bt.onclick=()=>{
  const sub=bt.dataset.s,mins=+$("#qT").value||0;qN=+$("#qN").value||5;qT=mins;
  const pool=b.filter(x=>sub==="All"||x.s===sub).map(x=>({x,r:Math.random()})).sort((a,c)=>a.r-c.r).map(o=>o.x).slice(0,Math.max(1,qN));
  Q={sub,list:pool,i:0,ans:[],left:mins*60,mins};
  if(mins){timer=setInterval(()=>{Q.left--;const t=$("#tm");if(t)t.textContent=fmt(Q.left);if(Q.left<=0)finish()},1000)}
  ask()});
};

openDB().then(()=>{renderMats();renderBank();renderFigs();renderSolver();show("quiz")});
