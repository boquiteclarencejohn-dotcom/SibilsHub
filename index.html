<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SibilsHub</title>
<script>window.MathJax={tex:{inlineMath:[["$","$"],["\\(","\\)"]],displayMath:[["$$","$$"]]},startup:{typeset:false},svg:{fontCache:"global"}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#ffffff;--card:#f5f8ff;--tx:#0f1f3d;--mu:#5b6b8c;--bl:#1d4ed8;--ac:#f97316;--ac2:#fff;--bd:#d6e0f5;--ok:#1b8a4b;--no:#c92a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#121b30;--tx:#eaf0ff;--mu:#9aa9c7;--bl:#60a5fa;--ac:#fb923c;--ac2:#0b1220;--bd:#243253;--ok:#4cc27f;--no:#ff7b7b}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#121b30;--tx:#eaf0ff;--mu:#9aa9c7;--bl:#60a5fa;--ac:#fb923c;--ac2:#0b1220;--bd:#243253;--ok:#4cc27f;--no:#ff7b7b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;border-top:5px solid var(--bl);background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:20px 16px 8px;max-width:760px;margin:auto}
h1{margin:0;font-size:22px;color:var(--bl)}h1 span{color:var(--ac)}
header p{margin:2px 0 0;color:var(--mu);font-size:14px}
nav{display:flex;gap:6px;max-width:760px;margin:8px auto;padding:0 16px;overflow-x:auto}
nav button{flex:1;white-space:nowrap}
main{max-width:760px;margin:auto;padding:8px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer}
button.p{background:var(--bl);color:var(--ac2);border-color:var(--bl);font-weight:600}
nav button.on{background:var(--bl);color:var(--ac2);border-color:var(--bl)}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;color:var(--mu)}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{border-color:var(--ok);color:var(--ok)}.opt.no{border-color:var(--no);color:var(--no)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.muted{color:var(--mu);font-size:14px}.hide{display:none}table{width:100%;border-collapse:collapse}td{border-top:1px solid var(--bd);padding:6px 4px;vertical-align:top;font-size:15px}td:first-child{color:var(--mu);width:36%}.chips{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px}.chip{white-space:nowrap;border-radius:20px;padding:6px 12px}.chip.on{background:var(--bl);color:var(--ac2);border-color:var(--bl)}summary{cursor:pointer}mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
a{color:var(--bl)}
</style>
</head>
<body>
<header><h1>Sibils<span>Hub</span></h1><p>Practice quizzes, your uploaded reviewers, and a quick-look library of figures and NSCP references.</p></header>
<nav id="nav"></nav>
<main>
 <section id="mats"></section>
 <section id="quiz" class="hide"></section>
 <section id="figs" class="hide"></section>
 <section id="solver" class="hide"></section>
 <section id="bank" class="hide"></section>
</main>
<script>
const SUBJECTS=["Statics","Dynamics","Calculus","Structural Analysis","Hydraulics","Geotechnical","Surveying","Materials"];
const SEED=[
{s:"Hydraulics",q:"Pressure at a depth of 10 m in fresh water (γ = 9.81 kN/m³)?",o:["9.81 kPa","98.1 kPa","981 kPa","19.62 kPa"],a:1,e:"p = γh = 9.81 × 10 = 98.1 kPa."},
{s:"Hydraulics",q:"Water flows at 2 m/s in a 0.20 m diameter pipe. Find Q.",o:["0.0314 m³/s","0.0628 m³/s","0.1256 m³/s","0.4 m³/s"],a:1,e:"Q = AV = (π/4)(0.2)²(2) ≈ 0.0628 m³/s."},
{s:"Structural Analysis",q:"Simply supported beam, L = 6 m, uniform load w = 10 kN/m. Maximum moment?",o:["30 kN·m","45 kN·m","60 kN·m","90 kN·m"],a:1,e:"$M=\\frac{wL^2}{8}=\\frac{10(6)^2}{8}=45$ kN·m."},
{s:"Structural Analysis",q:"Cantilever, L = 3 m, point load P = 20 kN at the free end. Fixed-end moment?",o:["6.67 kN·m","30 kN·m","60 kN·m","120 kN·m"],a:2,e:"M = PL = 20 × 3 = 60 kN·m."},
{s:"Geotechnical",q:"Void ratio e = 0.5. What is the porosity n?",o:["0.25","0.33","0.50","0.67"],a:1,e:"n = e/(1+e) = 0.5/1.5 ≈ 0.33."},
{s:"Geotechnical",q:"Total stress is 200 kPa and pore pressure is 50 kPa. Effective stress?",o:["250 kPa","150 kPa","200 kPa","50 kPa"],a:1,e:"σ′ = σ − u = 200 − 50 = 150 kPa."},
{s:"Surveying",q:"Sum of the interior angles of a closed hexagon?",o:["540°","630°","720°","900°"],a:2,e:"(n − 2)(180°) = 4 × 180° = 720°."},
{s:"Calculus",q:"Evaluate $\\int_0^3 x^2\\,dx$.",o:["3","9","18","27"],a:1,e:"$\\frac{x^3}{3}\\Big|_0^3=\\frac{27}{3}=9$."},
{s:"Materials",q:"Approximate modulus of elasticity of structural steel?",o:["20 GPa","70 GPa","200 GPa","2000 GPa"],a:2,e:"Steel has E ≈ 200 GPa (about 200,000 MPa)."},
{s:"Statics",q:"A 100 N force acts 30° above the horizontal. Find its horizontal component $F_x$.",o:["50 N","86.6 N","100 N","57.7 N"],a:1,e:"$F_x=F\\cos\\theta=100\\cos30°=86.6$ N."},
{s:"Statics",q:"A 10 kN load acts at midspan of a simply supported beam. Reaction at each support?",o:["5 kN","10 kN","20 kN","2.5 kN"],a:0,e:"By symmetry each support carries $P/2=5$ kN."},
{s:"Dynamics",q:"A car starts from rest and accelerates at 2 m/s² for 5 s. Distance traveled?",o:["10 m","25 m","50 m","5 m"],a:1,e:"$s=\\tfrac{1}{2}at^2=\\tfrac{1}{2}(2)(5)^2=25$ m."},
{s:"Dynamics",q:"Kinetic energy of a 10 kg mass moving at 4 m/s?",o:["20 J","40 J","80 J","160 J"],a:2,e:"$KE=\\tfrac{1}{2}mv^2=\\tfrac{1}{2}(10)(4)^2=80$ J."},
{s:"Calculus",q:"Find $\\dfrac{dy}{dx}$ if $y=x^3+2x$.",o:["$3x^2+2$","$x^2+2$","$3x^2$","$3x+2$"],a:0,e:"Power rule: $3x^2+2$."},
{s:"Structural Analysis",q:"A propped cantilever beam is statically indeterminate to what degree?",o:["0","1","2","3"],a:1,e:"It has 4 reactions and 3 equilibrium equations, so the degree is 4 − 3 = 1."}
];
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert("Storage is full or blocked.")}}};
let db=null;const mem=new Map();
function openDB(){return new Promise(r=>{try{const q=indexedDB.open("ce-hub",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function putFile(id,blob){return new Promise(r=>{if(!db){mem.set(id,blob);return r()}const t=db.transaction("f","readwrite");t.objectStore("f").put(blob,id);t.oncomplete=()=>r();t.onerror=()=>{mem.set(id,blob);r()}})}
function getFile(id){return new Promise(r=>{if(!db)return r(mem.get(id));const q=db.transaction("f").objectStore("f").get(id);q.onsuccess=()=>r(q.result||mem.get(id));q.onerror=()=>r(mem.get(id))})}
function delFile(id){mem.delete(id);if(db)try{db.transaction("f","readwrite").objectStore("f").delete(id)}catch(e){}}

/* NAV */
const TABS=[["quiz","Quiz"],["mats","Upload"],["figs","Diagrams"],["solver","Beam solver"],["bank","My questions"]];
function show(id){TABS.forEach(([k])=>{$("#"+k).classList.toggle("hide",k!==id)});[...$("#nav").children].forEach((b,i)=>b.classList.toggle("on",TABS[i][0]===id));if(id==="quiz"&&!$("#quiz").innerHTML.trim())quizSetup();if(id==="figs")typeset($("#figs"))}
$("#nav").innerHTML=TABS.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join("");
$("#nav").onclick=e=>{const k=e.target.dataset.k;if(k)show(k)};

/* MATERIALS */
function renderMats(filter){
 const m=LS.get("mats",[]);const f=filter||"All";
 const list=m.filter(x=>f==="All"||x.subject===f);
 $("#mats").innerHTML=`<div class="card"><label>Subject</label>
 <select id="mSub">${SUBJECTS.map(s=>`<option>${s}</option>`).join("")}</select>
 <label>Choose files (PDF, images, docs)</label><input type="file" id="mFile" multiple>
 <button class="p" id="mAdd">Upload</button>
 <p class="muted">Files stay in this browser on your device. Sharing with classmates needs an online backend (next step).</p></div>
 <div class="row"><label>Filter</label><select id="mFil" style="width:auto"><option>All</option>${SUBJECTS.map(s=>`<option ${s===f?"selected":""}>${s}</option>`).join("")}</select></div>
 ${list.length?list.map(x=>`<div class="card row"><div><b>${esc(x.name)}</b><br><span class="tag">${esc(x.subject)}</span> <span class="muted">${(x.size/1024).toFixed(0)} KB</span></div>
 <div><button data-o="${x.id}">Open</button> <button data-d="${x.id}">Delete</button></div></div>`).join(""):`<p class="muted">No materials yet. Upload your first reviewer above.</p>`}`;
 $("#mFil").onchange=e=>renderMats(e.target.value);
 $("#mAdd").onclick=async()=>{
  const files=[...$("#mFile").files];if(!files.length)return;
  const all=LS.get("mats",[]);
  for(const fl of files){const id=Date.now()+"-"+Math.random().toString(36).slice(2,7);await putFile(id,fl);all.push({id,name:fl.name,subject:$("#mSub").value,size:fl.size})}
  LS.set("mats",all);renderMats(f)};
 $("#mats").querySelectorAll("[data-o]").forEach(b=>b.onclick=async()=>{const bl=await getFile(b.dataset.o);if(!bl)return alert("File not found on this device.");window.open(URL.createObjectURL(bl),"_blank")});
 $("#mats").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(!confirm("Delete this file?"))return;delFile(b.dataset.d);LS.set("mats",LS.get("mats",[]).filter(x=>x.id!==b.dataset.d));renderMats(f)});
}

/* QUIZ */
const bankAll=()=>SEED.concat(LS.get("qs",[]));
let Q=null,timer=null;
function quizSetup(){
 clearInterval(timer);const b=bankAll();
 const hist=LS.get("hist",[]);
 $("#quiz").innerHTML=`<div class="card"><label>Subject</label>
 <select id="qSub"><option>All</option>${SUBJECTS.map(s=>`<option>${s}</option>`).join("")}</select>
 <label>Number of questions</label><input id="qN" type="number" min="1" value="5">
 <label>Time limit in minutes (0 = no limit)</label><input id="qT" type="number" min="0" value="0">
 <button class="p" id="qGo">Start quiz</button>
 <p class="muted">${b.length} questions in the bank.</p></div>
 ${hist.length?`<div class="card"><b>Recent scores</b>${hist.slice(-5).reverse().map(h=>`<div class="row muted"><span>${esc(h.s)} · ${esc(h.d)}</span><span>${h.c}/${h.n}</span></div>`).join("")}</div>`:""}`;
 $("#qGo").onclick=()=>{
  const sub=$("#qSub").value;let pool=b.filter(x=>sub==="All"||x.s===sub);
  if(!pool.length)return alert("No questions for that subject yet.");
  pool=pool.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x).slice(0,Math.max(1,+$("#qN").value||5));
  const mins=+$("#qT").value||0;
  Q={sub,list:pool,i:0,ans:[],left:mins*60,mins};
  if(mins){timer=setInterval(()=>{Q.left--;const t=$("#tm");if(t)t.textContent=fmt(Q.left);if(Q.left<=0)finish()},1000)}
  ask()};
}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const typeset=el=>{try{if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el||$("#quiz")])}catch(e){}};
const imgTag=q=>q.img?`<img src="${q.img}" alt="Diagram" style="max-width:100%;border-radius:8px;background:#fff;margin:6px 0">`:"";
function shrink(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.85))};im.onerror=()=>r("");im.src=fr.result};fr.onerror=()=>r("");fr.readAsDataURL(file)})}
function ask(){
 const q=Q.list[Q.i];
 $("#quiz").innerHTML=`<div class="card"><div class="row"><span class="tag">${esc(q.s)}</span><span class="muted">${Q.i+1}/${Q.list.length}${Q.mins?` · <b id="tm">${fmt(Q.left)}</b>`:""}</span></div>
 <div class="bar" style="margin:10px 0"><i style="width:${Q.i/Q.list.length*100}%"></i></div>
 <p><b>${esc(q.q)}</b></p>${imgTag(q)}${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div>`;
 $("#quiz").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{Q.ans[Q.i]=+b.dataset.i;if(++Q.i>=Q.list.length)finish();else ask()});
 typeset();
}
function finish(){
 clearInterval(timer);if(!Q)return;
 const L=Q.list,c=L.filter((q,i)=>Q.ans[i]===q.a).length;
 const h=LS.get("hist",[]);h.push({s:Q.sub,c,n:L.length,d:new Date().toLocaleDateString()});LS.set("hist",h.slice(-30));
 $("#quiz").innerHTML=`<div class="card"><h2 style="margin:0">Score: ${c}/${L.length} (${Math.round(c/L.length*100)}%)</h2></div>
 ${L.map((q,i)=>`<div class="card"><p><b>${i+1}. ${esc(q.q)}</b></p>${imgTag(q)}${q.o.map((o,j)=>`<div class="opt ${j===q.a?"ok":j===Q.ans[i]?"no":""}" style="padding:6px 0">${String.fromCharCode(65+j)}. ${esc(o)}${j===q.a?" ✓":j===Q.ans[i]?" ✗":""}</div>`).join("")}<p class="muted">${esc(q.e||"")}</p></div>`).join("")}
 <button class="p" id="again">Back to setup</button>`;
 Q=null;$("#again").onclick=quizSetup;typeset();
}

/* ADD QUESTIONS */
function renderBank(){
 const mine=LS.get("qs",[]);
 $("#bank").innerHTML=`<div class="card"><label>Subject</label><select id="bS">${SUBJECTS.map(s=>`<option>${s}</option>`).join("")}</select>
 <label>Question</label><textarea id="bQ" rows="2"></textarea>
 <p class="muted" style="margin:0 0 8px">Equations: wrap in dollar signs, e.g. $x^2$ or $\\frac{a}{b}$</p>
 <label>Diagram image (optional)</label><input type="file" id="bImg" accept="image/*">
 ${[0,1,2,3].map(i=>`<label>Choice ${String.fromCharCode(65+i)}</label><input class="bo">`).join("")}
 <label>Correct answer</label><select id="bA"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
 <label>Solution / explanation</label><textarea id="bE" rows="2"></textarea>
 <button class="p" id="bAdd">Save question</button></div>
 <p class="muted">Your questions (${mine.length})</p>
 ${mine.map((q,i)=>`<div class="card row"><span>${esc(q.q.slice(0,70))}</span><button data-x="${i}">Delete</button></div>`).join("")}`;
 $("#bAdd").onclick=async()=>{
  const o=[...$("#bank").querySelectorAll(".bo")].map(x=>x.value.trim());
  if(!$("#bQ").value.trim()||o.some(x=>!x))return alert("Fill in the question and all four choices.");
  mine.push({s:$("#bS").value,q:$("#bQ").value.trim(),o,a:+$("#bA").value,e:$("#bE").value.trim(),img:$("#bImg").files[0]?await shrink($("#bImg").files[0]):""});
  LS.set("qs",mine);if(!Q)$("#quiz").innerHTML="";renderBank()};
 $("#bank").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{mine.splice(+b.dataset.x,1);LS.set("qs",mine);renderBank()});
}

/* DIAGRAMS & NSCP REFERENCE */
const FIGS=[
{c:"Beams",t:"Simply supported, uniform load",f:"ssu",v:[["Reactions","$R=\\frac{wL}{2}$"],["Max shear","$V_{max}=\\frac{wL}{2}$ at supports"],["Max moment","$M_{max}=\\frac{wL^2}{8}$ at midspan"],["Max deflection","$\\delta_{max}=\\frac{5wL^4}{384EI}$"]]},
{c:"Beams",t:"Simply supported, midspan point load",f:"ssp",v:[["Reactions","$R=\\frac{P}{2}$"],["Max shear","$V_{max}=\\frac{P}{2}$"],["Max moment","$M_{max}=\\frac{PL}{4}$ at midspan"],["Max deflection","$\\delta_{max}=\\frac{PL^3}{48EI}$"]]},
{c:"Beams",t:"Cantilever, end point load",f:"cp",v:[["Reaction","$R=P$"],["Max moment","$M_{max}=PL$ at the fixed end"],["Max deflection","$\\delta_{max}=\\frac{PL^3}{3EI}$ at the free end"]]},
{c:"Beams",t:"Cantilever, uniform load",f:"cu",v:[["Reaction","$R=wL$"],["Max moment","$M_{max}=\\frac{wL^2}{2}$ at the fixed end"],["Max deflection","$\\delta_{max}=\\frac{wL^4}{8EI}$"]]},
{c:"Beams",t:"Fixed-fixed beam, uniform load",f:"fu",v:[["Reactions","$R=\\frac{wL}{2}$"],["End moment","$M=\\frac{wL^2}{12}$ (hogging)"],["Midspan moment","$M=\\frac{wL^2}{24}$ (sagging)"],["Max deflection","$\\delta_{max}=\\frac{wL^4}{384EI}$"]]},
{c:"NSCP",t:"Strength design load combinations",r:"NSCP 2015 Sec. 203",v:[["1","1.4D"],["2","1.2D + 1.6L + 0.5(Lr or R)"],["3","1.2D + 1.6(Lr or R) + (L or 0.5W)"],["4","1.2D + 1.0W + L + 0.5(Lr or R)"],["5","1.2D + 1.0E + L"],["6","0.9D + 1.0W"],["7","0.9D + 1.0E"]],n:"D dead, L live, Lr roof live, R rain, W wind, E earthquake. Check Sec. 203 for the complete list, including special cases and the seismic overstrength combinations."},
{c:"NSCP",t:"Static seismic base shear",r:"NSCP 2015 Sec. 208",v:[["Design base shear","$V=\\frac{C_vIW}{RT}$"],["Upper limit","$V\\le\\frac{2.5C_aIW}{R}$"],["Lower limit","$V\\ge0.11C_aIW$"],["Zone 4 minimum","$V\\ge\\frac{0.8ZN_vIW}{R}$"],["Period","$T=C_t(h_n)^{3/4}$, with $h_n$ in m"],["$C_t$","0.0853 steel moment frame · 0.0731 concrete moment frame · 0.0488 others"],["Zone factor","$Z=0.20$ (Zone 2), $Z=0.40$ (Zone 4)"]],n:"$C_a$, $C_v$, $N_a$, $N_v$, $R$ and $I$ come from the tables in that section. Look them up in your copy of the code."},
{c:"Concrete",t:"Reinforced concrete strength design",r:"NSCP 2015 Ch. 4 (ACI 318M-14 based)",v:[["Modulus of elasticity","$E_c=4700\\sqrt{f'_c}$ MPa"],["Modulus of rupture","$f_r=0.62\\sqrt{f'_c}$ MPa"],["Ultimate concrete strain","$\\varepsilon_{cu}=0.003$"],["Stress block depth","$a=\\frac{A_sf_y}{0.85f'_cb}$"],["Nominal moment","$M_n=A_sf_y\\left(d-\\frac{a}{2}\\right)$"],["$\\beta_1$","0.85 for $f'_c\\le28$ MPa, minus 0.05 per 7 MPa above, min 0.65"],["Minimum steel","$\\rho_{min}=\\max\\left(\\frac{\\sqrt{f'_c}}{4f_y},\\frac{1.4}{f_y}\\right)$"],["Strength reduction $\\phi$","0.90 tension-controlled · 0.65 tied columns · 0.75 spiral columns and shear"]]},

 }
 const k=M.map(m=>m/EI),s=[0],d=[0];
 for(let i=1;i<=N;i++){s.push(s[i-1]+h*(k[i]+k[i-1])/2);d.push(d[i-1]+h*(s[i]+s[i-1])/2)}
 const t0=ct?0:-d[N]/L;
 return{xs,V,M,k,RA,RB,M0,th:s.map(v=>(v+t0)*180/Math.PI),dl:d.map((v,i)=>-(v+t0*xs[i])*1000)};
}
function plot(xs,a,title,unit,f){
 const [b,j]=mx(a),s=b?36/Math.abs(b):0,Lx=xs[xs.length-1];
 const p=xs.map((x,i)=>(20+x/Lx*260).toFixed(1)+" "+(45-f*a[i]*s).toFixed(1)).join("L");
 return `<div class="card"><div class="row"><b>${title}</b><span class="muted">max ${nf(b)} ${unit} at x = ${xs[j].toFixed(2)} m</span></div><svg viewBox="0 0 300 90" style="width:100%;display:block"><path d="M20 45H280" style="stroke:currentColor;stroke-dasharray:3 3;fill:none"/><path d="M20 45L${p}L280 45Z" style="fill:var(--ac);fill-opacity:.2;stroke:var(--ac);stroke-width:2"/></svg></div>`;
}
function schem(sup,L,loads){
 const X=x=>+(20+x/L*260).toFixed(1);
 const ar=(x,up)=>up?`M${x} 38V8M${x-4} 14L${x} 8L${x+4} 14`:`M${x} 8V38M${x-4} 32L${x} 38L${x+4} 32`;
 let q="";
 loads.forEach(l=>{const up=l.m<0;if(l.t==="P")q+=ar(X(l.a),up);else{const x1=X(l.a),x2=X(l.b);q+=`M${x1} 8H${x2}`;for(let i=0;i<=6;i++)q+=ar(+(x1+(x2-x1)*i/6).toFixed(1),up)}});
 const sp=sup==="ss"?"M20 40l-7 14h14zM280 40l-7 14h14z":"M20 22V58";
 return `<svg viewBox="0 0 300 66" style="width:100%;display:block"><path d="M20 40H280${sp}" style="stroke:currentColor;stroke-width:3;fill:none"/><path d="${q}" style="stroke:var(--ac);stroke-width:2;fill:none"/></svg>`;
}
function sList(){
 $("#sList").innerHTML=SL.length?SL.map((l,i)=>`<div class="row muted"><span>${l.t==="P"?`P = ${l.m} kN at x = ${l.a} m`:`w = ${l.m} kN/m from x = ${l.a} to ${l.b} m`}</span><button data-r="${i}">Remove</button></div>`).join(""):`<p class="muted">No loads yet.</p>`;
 $("#sList").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{SL.splice(+b.dataset.r,1);sList()});
}
function renderSolver(){
 $("#solver").innerHTML=`<div class="card"><label>Support</label><select id="sSup"><option value="ss">Simply supported</option><option value="ct">Cantilever (fixed at left end)</option></select>
 <label>Span L (m)</label><input id="sL" type="number" value="6" step="any">
 <label>E (GPa)</label><input id="sE" type="number" value="200" step="any">
 <label>I (×10⁶ mm⁴)</label><input id="sI" type="number" value="500" step="any"></div>
 <div class="card"><b>Loads</b> <span class="muted">(downward is positive; use a negative value for upward)</span><div id="sList"></div>
 <label>Type</label><select id="lT"><option value="P">Point load P (kN)</option><option value="w">Uniform load w (kN/m)</option></select>
 <label>Magnitude</label><input id="lM" type="number" value="10" step="any">
 <label>Position a (m)</label><input id="lA" type="number" value="0" step="any">
 <div id="lBw"><label>Ends at b (m)</label><input id="lB" type="number" value="6" step="any"></div>
 <button id="lAdd">Add load</button></div>
 <button class="p" id="sGo">Solve</button><div id="sOut"></div>`;
 sList();
 $("#lT").onchange=()=>$("#lBw").classList.toggle("hide",$("#lT").value==="P");$("#lT").value="w";$("#lT").onchange();
 $("#lAdd").onclick=()=>{
  const t=$("#lT").value,m=+$("#lM").value,a=+$("#lA").value,b=+$("#lB").value,L=+$("#sL").value;
  if(!m||!(a>=0&&a<=L))return alert("Check the magnitude and position.");
  if(t==="w"&&!(b>a&&b<=L))return alert("For a uniform load, b must be greater than a and not beyond L.");
  SL.push({t,m,a,b:t==="w"?b:a});sList()};
 $("#sGo").onclick=()=>{
  const L=+$("#sL").value,EI=$("#sE").value*$("#sI").value,sup=$("#sSup").value;
  if(!(L>0&&EI>0))return alert("Enter positive L, E and I.");
  if(!SL.length)return alert("Add at least one load.");
  if(SL.some(l=>l.a>L||l.b>L))return alert("A load lies beyond the span. Remove it or increase L.");
  const r=solveBeam(sup,L,EI,SL),at=(a,u)=>{const[b,j]=mx(a);return `${nf(b)} ${u} at x = ${r.xs[j].toFixed(2)} m`};
  const km=mx(r.k)[0],dm=Math.abs(mx(r.dl)[0]),R=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`;
  $("#sOut").innerHTML=`<div class="card">${schem(sup,L,SL)}<div style="overflow-x:auto"><table>`+
   R("Reactions",sup==="ss"?`R<sub>A</sub> = ${nf(r.RA)} kN, R<sub>B</sub> = ${nf(r.RB)} kN`:`R = ${nf(r.RA)} kN, M<sub>fixed</sub> = ${nf(r.M0)} kN·m`)+
   R("Max shear",at(r.V,"kN"))+R("Max moment",at(r.M,"kN·m"))+R("Max deflection",at(r.dl,"mm"))+R("Span / deflection",dm?"L/"+nf(L*1000/dm,3):"none")+R("Max slope",at(r.th,"°"))+R("Max curvature",`${nf(km)} 1/m`+(km?` (radius ${nf(Math.abs(1/km))} m)`:""))+
   `</table></div></div>`+plot(r.xs,r.V,"Shear V","kN",1)+plot(r.xs,r.M,"Bending moment M","kN·m",-1)+plot(r.xs,r.th,"Slope θ (degrees)","°",1)+plot(r.xs,r.dl,"Deflection δ (downward)","mm",-1)+plot(r.xs,r.k,"Curvature κ = M/EI","1/m",-1);
 };
}

openDB().then(()=>{renderMats();renderBank();renderFigs();renderSolver();show("quiz")});
</script>
